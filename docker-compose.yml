# bookshelf-in-a-box
# A one-command, self-hosted ebook server built on top of the excellent
# Calibre-Web Automated project (https://github.com/crocodilestick/Calibre-Web-Automated).
#
# You normally do NOT edit this file. Run ./setup.sh (or setup.ps1 on Windows)
# and it takes care of everything. Settings you might want to change live
# in the .env file instead.

services:
  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: bookshelf-in-a-box
    restart: unless-stopped

    environment:
      # Run as your normal user so files stay readable/writable by you.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Your timezone, read from the .env file.
      - TZ=${TZ:-Etc/UTC}
      # Automatically convert incoming books to EPUB for best compatibility.
      - CWA_AUTOCONVERT=true
      # Set to true in .env only when your library is on a network share.
      - NETWORK_SHARE_MODE=${NETWORK_SHARE_MODE:-false}

    ports:
      # host:container  ->  visit http://localhost:<PORT>
      - "${PORT:-8083}:8083"

    volumes:
      # Persistent settings and the app database.
      - ./data/config:/config
      # Your actual book library lives here.
      - ./data/library:/calibre-library
      # Drop new books in here; they are auto-imported into the library.
      - ./data/ingest:/cwa-book-ingest

    healthcheck:
      # Consider the container healthy once the web UI answers.
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
