# Serves the visual gallery + your cover images (used by docker-compose.dashboard.yml).
server {
    listen 8084;
    server_name _;
    root /usr/share/nginx/html;      # docs/gallery
    index index.html;

    # Generated library data (from scripts/gallery.sh). Falls back to demo data if absent.
    location = /library.json {
        alias /gallery-data/library.json;
        add_header Cache-Control "no-store";
    }

    # Your actual book covers (read-only mount of data/library).
    location /covers/ {
        alias /covers/;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
