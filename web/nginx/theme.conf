# Reverse proxy that injects a custom stylesheet into Calibre-Web's pages,
# restyling the real app without modifying it. Used by docker-compose.theme.yml.
server {
    listen 8083;
    server_name _;

    # Serve the selected theme (mounted from web/themes/<THEME>.css).
    location = /_bookshelf/theme.css {
        alias /theme/theme.css;
        default_type text/css;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://calibre-web-automated:8083;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ask upstream for uncompressed HTML so sub_filter can rewrite it.
        proxy_set_header Accept-Encoding   "";

        # Inject our stylesheet just before </head> on HTML pages.
        sub_filter '</head>' '<link rel="stylesheet" href="/_bookshelf/theme.css"></head>';
        sub_filter_once on;
        sub_filter_types text/html;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
