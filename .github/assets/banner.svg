<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="bookshelf-in-a-box - your own ebook library, readable on every device">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 800 68px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: -1px; }
      .tag   { font: 400 27px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #c7d2fe; }
      .pill  { font: 700 19px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #e0e7ff; }
      .mono  { font: 600 20px 'SFMono-Regular', 'Consolas', monospace; fill: #a5b4fc; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>

  <!-- Decorative dots -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="1120" cy="60" r="140"/>
    <circle cx="1220" cy="300" r="90"/>
  </g>

  <!-- ================= Left: the "box" with a bookshelf inside ================= -->
  <g transform="translate(96 96)" filter="url(#soft)">
    <!-- open cardboard box -->
    <rect x="0" y="24" width="200" height="150" rx="10" fill="#0b1220" stroke="url(#accent)" stroke-width="3"/>
    <!-- box flaps -->
    <path d="M0 34 L40 0 L160 0 L200 34" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round" opacity="0.85"/>
    <!-- shelf line -->
    <rect x="18" y="150" width="164" height="8" rx="4" fill="url(#accent)" opacity="0.9"/>
    <!-- book spines -->
    <g>
      <rect x="26"  y="60" width="24" height="90" rx="4" fill="#f472b6"/>
      <rect x="54"  y="48" width="24" height="102" rx="4" fill="#38bdf8"/>
      <rect x="82"  y="66" width="24" height="84" rx="4" fill="#34d399"/>
      <rect x="110" y="52" width="24" height="98" rx="4" fill="#fbbf24"/>
      <rect x="138" y="62" width="24" height="88" rx="4" fill="#a78bfa"/>
    </g>
  </g>

  <!-- ================= Right: text ================= -->
  <g transform="translate(348 118)">
    <text class="title" x="0" y="52">📚 bookshelf-in-a-box</text>
    <text class="tag"   x="2" y="100">Your own ebook library — readable on every device.</text>
    <text class="mono"  x="2" y="142">$ ./setup.sh  →  http://localhost:8083</text>

    <!-- feature pills -->
    <g transform="translate(2 172)">
      <g>
        <rect x="0" y="0" width="180" height="40" rx="20" fill="#1e293b" stroke="url(#accent)" stroke-width="1.5"/>
        <text class="pill" x="20" y="26">⚡ One command</text>
      </g>
      <g transform="translate(196 0)">
        <rect x="0" y="0" width="196" height="40" rx="20" fill="#1e293b" stroke="url(#accent)" stroke-width="1.5"/>
        <text class="pill" x="20" y="26">🐳 Just needs Docker</text>
      </g>
      <g transform="translate(408 0)">
        <rect x="0" y="0" width="150" height="40" rx="20" fill="#1e293b" stroke="url(#accent)" stroke-width="1.5"/>
        <text class="pill" x="20" y="26">💸 £0 / $0</text>
      </g>
    </g>
  </g>
</svg>
